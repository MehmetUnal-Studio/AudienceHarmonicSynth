plugins {
    id "com.android.application"
}

def juceDir = file("../../build/_deps/juce-src")
def generatedAssetsDir = layout.buildDirectory.dir("generated/audienceAssets")

android {
    namespace "com.mehmetunal.audienceharmonicsynth"
    compileSdk 34

    defaultConfig {
        applicationId "com.mehmetunal.audienceharmonicsynth"
        minSdk 29
        targetSdk 34
        versionCode 101
        versionName "1.0.1"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                targets "AudienceHarmonicSynth_Standalone"
                arguments "-DAUDIENCE_SYNTH_BUILD_TESTS=OFF",
                          "-DCMAKE_BUILD_TYPE=Release",
                          "-DFETCHCONTENT_SOURCE_DIR_JUCE=${juceDir.absolutePath}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            java.srcDirs = [
                "src/main/java",
                "${juceDir}/modules/juce_core/native/javacore/init",
                "${juceDir}/modules/juce_core/native/javacore/app",
                "${juceDir}/modules/juce_core/native/java/app",
                "${juceDir}/modules/juce_gui_basics/native/java/app",
                "${juceDir}/modules/juce_gui_basics/native/javaopt/app",
                "${juceDir}/modules/juce_gui_extra/native/java/app",
                "${juceDir}/modules/juce_audio_devices/native/java/app"
            ]
            assets.srcDir generatedAssetsDir
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.register("syncSamplesToAndroidAssets", Sync) {
    from file("../../Samples")
    into generatedAssetsDir.map { it.dir("Samples") }
    exclude "**/*.orig", "**/.DS_Store"
}

preBuild.dependsOn "syncSamplesToAndroidAssets"
